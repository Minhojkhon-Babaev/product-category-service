[project]
name = "product-category-service"
version = "1.0.0"
description = "Production service for e-commerce product category classification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.40.0",
    "fastapi==0.116.1",
    "joblib==1.5.1",
    "numpy==2.2.6",
    "prometheus-client==0.22.1",
    "pydantic-settings==2.10.1",
    "redis==6.4.0",
    "scikit-learn==1.9.1",
    "scipy==1.15.3",
    "tritonclient[http]==2.59.0",
    "uvicorn[standard]==0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_service", "src/drift_monitor"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "pytest-mock==3.14.1",
    "python-pptx==1.0.2",
    "ruff==0.12.7",
    "skl2onnx==1.19.1",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
