stages:
  - quality
  - build

default:
  interruptible: true

lint:
  stage: quality
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --frozen
    - uv run ruff check .

test:
  stage: quality
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --frozen
    - uv run pytest --cov-report=term --cov-report=xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t product-category-api:$CI_COMMIT_SHA .

compose-config:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    AWS_ACCESS_KEY_ID: ci-placeholder
    AWS_SECRET_ACCESS_KEY: ci-placeholder
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - docker compose config --quiet
