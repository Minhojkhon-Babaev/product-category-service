stages:
  - quality
  - build

default:
  interruptible: true

lint:
  stage: quality
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --frozen
    - uv run ruff check .

test:
  stage: quality
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - uv sync --frozen
    - uv run pytest --cov-report=term --cov-report=xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "product-category-api:${CI_COMMIT_SHA}"
      --no-push

compose-config:
  stage: build
  image: docker:27-cli
  variables:
    AWS_ACCESS_KEY_ID: ci-placeholder
    AWS_SECRET_ACCESS_KEY: ci-placeholder
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - docker compose config --quiet
