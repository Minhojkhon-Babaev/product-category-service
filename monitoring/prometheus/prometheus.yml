global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: product-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: drift-monitor
    static_configs:
      - targets: ["drift-monitor:8001"]

  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
